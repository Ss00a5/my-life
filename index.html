<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مركزي الشخصي</title>
<meta name="description" content="مركز شخصي لتنظيم المهام والعادات والتعلم والمشاريع">
<meta name="theme-color" content="#1f7a6d">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2a2e;--mu:#6b777c;--ac:#1f7a6d;--ac2:#e3f2ef;--bd:#e4e0d6;--wa:#c0492f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191b;--card:#1d2528;--tx:#e8eeee;--mu:#93a1a5;--ac:#4fc3b0;--ac2:#1f3532;--bd:#2c383b;--wa:#ef8a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14191b;--card:#1d2528;--tx:#e8eeee;--mu:#93a1a5;--ac:#4fc3b0;--ac2:#1f3532;--bd:#2c383b;--wa:#ef8a70;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:760px;margin:0 auto;padding:14px}
h2{font-size:18px;margin:6px 0 12px}h3{font-size:15px;margin:0 0 8px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;max-width:100%}
button{cursor:pointer}.p{background:var(--ac);color:#fff;border-color:var(--ac)}.g{border:0;background:transparent;padding:4px 6px}
.chip{font-size:12px;background:var(--ac2);color:var(--ac);border-radius:20px;padding:2px 9px}
.mu{color:var(--mu);font-size:13px}.wa{color:var(--wa)}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.row .t{flex:1;min-width:0}.done .tt{text-decoration:line-through;color:var(--mu)}
.big{font-size:54px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;direction:ltr;margin:10px 0}
.bar{height:10px;background:var(--ac2);border-radius:8px;overflow:hidden;flex:1;min-width:80px}.bar i{display:block;height:100%;background:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;flex:0 0 auto;min-width:62px;font-size:11px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px}
nav button b{font-size:19px;font-weight:400}nav .on{color:var(--ac);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.site{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--tx);font-size:12px;text-align:center}
.ic{width:46px;height:46px;border-radius:13px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);width:min(92vw,440px);padding:14px}
dialog label{display:block;margin:8px 0 3px;font-size:13px;color:var(--mu)}dialog input,dialog select,dialog textarea{width:100%}
.days label{display:inline-flex;gap:3px;align-items:center;margin:2px 6px 2px 0;color:var(--tx)}.days input{width:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.cal div{padding:8px 0;border-radius:8px;background:var(--ac2);cursor:pointer}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;background:var(--ac);color:#fff;padding:12px;border-radius:12px;z-index:9;text-align:center}
</style></head><body>
<div id="sy" style="position:fixed;top:calc(4px + env(safe-area-inset-top,0px));left:8px;font-size:11px;color:var(--mu);z-index:5;pointer-events:none">💾 محفوظ في متصفحك</div><main id="m"></main><nav id="nav"></nav><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
let D={};try{D=JSON.parse(localStorage.getItem('hub'))||{}}catch(e){}
const mk=(id,n,ic,c)=>({id,n,ic,c:c||'',links:[],items:[],note:''});
const dflt={fields:[],cats:['تعلم','عمل','القراءة','البحث عن الوظائف','العبادات','الصحة والعناية','مشاريع','أخرى'],projects:[],tasks:[],habits:[],hlog:{},sessions:[],goals:[],active:null,fired:{},cfg:{pomo:25,brk:5},jobs:{custom:[],log:[],goal:5},learn:[],revs:[],ideas:[],todo:[],books:[],rlog:[]};
for(const k in dflt)if(D[k]==null)D[k]=dflt[k];
const setSy=t=>{const e=document.getElementById('sy');if(e)e.textContent=t};
const save=()=>{D.act=D.act||{};D.act[ds()]=1;D._at=Date.now();try{localStorage.setItem('hub',JSON.stringify(D))}catch(e){setSy('⚠️ المتصفح يمنع الحفظ')}};
const ds=d=>{d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const add=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return ds(d)};
const dow=s=>new Date(s+'T00:00').getDay();
const today=()=>ds();
const opts=(l,s,e)=>(e?'<option value="">'+e+'</option>':'')+l.map(x=>'<option'+(x===s?' selected':'')+'>'+esc(x)+'</option>').join('');
const fm=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?h+'س '+m+'د':m+'د'};
const hms=s=>{s=Math.max(0,Math.floor(s/1000));return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')};
const occ=(t,d)=>!(t.skip&&t.skip[d])&&(t.rep&&t.rep.length?d>=t.date&&t.rep.includes(dow(d)):t.date===d);
const tasksOn=d=>D.tasks.filter(t=>occ(t,d)).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
const overdue=()=>{const o=[];D.tasks.forEach(t=>{for(let i=1;i<=14;i++){const d=add(today(),-i);if(occ(t,d)&&!(t.done&&t.done[d])&&(!t.rep||!t.rep.length||i<=3))o.push([t,d])}});return o};
const toast=m=>{const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),5000)};
function notify(m){toast(m);try{if(window.Notification&&Notification.permission==='granted')new Notification('مركزي الشخصي',{body:m})}catch(e){}if(navigator.vibrate)navigator.vibrate(200)}

let tab='home',pv='day',pd=today(),rg='week',tm='sw';
const TABS=[['home','🏠','الرئيسية'],['todo','📝','المهام'],['timer','⏱️','المؤقت'],['plan','📅','الجدول'],['habits','✅','العادات'],['proj','🎯','المشاريع'],['jobs','💼','الوظائف'],['learn','🎓','التعلم'],['books','📚','الكتب'],['rev','🔁','المراجعة'],['idea','💡','الأفكار'],['rep','📊','التقارير'],['set','⚙️','الإعدادات']];
function go(t){tab=t;render()}
function render(){
 $('#nav').innerHTML=TABS.map(x=>`<button class="${x[0]===tab?'on':''}" onclick="go('${x[0]}')"><b>${x[1]}</b>${x[2]}</button>`).join('');
 $('#m').innerHTML=V[tab]();window.scrollTo(0,0)}

/* ---- tasks ---- */
function trow(t,d){const dn=t.done&&t.done[d];const act=D.sessions.filter(s=>s.task===t.id&&s.date===d).reduce((a,s)=>a+s.sec,0);
 return `<div class="row ${dn?'done':''}"><input type="checkbox" ${dn?'checked':''} onchange="tg(${t.id},'${d}')"><div class="t"><div class="tt">${esc(t.t)}</div><div class="mu">${t.time||''} ${t.dur?'· '+t.dur+'د':''} ${act?'· فعلي '+fm(act):''} ${t.rep&&t.rep.length?'· 🔁':''}</div><span class="chip">${esc(t.cat||'')}</span></div>
 <button class="g" onclick="tstart(${t.id})">▶</button><button class="g" onclick="mv(${t.id},'${d}')">⏭</button><button class="g" onclick="tdlg(${t.id})">✎</button><button class="g" onclick="del(${t.id})">🗑</button></div>`}
function tg(id,d){const t=D.tasks.find(x=>x.id===id);t.done=t.done||{};t.done[d]?delete t.done[d]:t.done[d]=1;save();render()}
function del(id){if(confirm('حذف المهمة؟')){D.tasks=D.tasks.filter(t=>t.id!==id);save();render()}}
function mv(id,d){const n=prompt('نقل إلى تاريخ (YYYY-MM-DD):',add(d,1));if(!n)return;const t=D.tasks.find(x=>x.id===id);
 if(t.rep&&t.rep.length){t.skip=t.skip||{};t.skip[d]=1;D.tasks.push({id:Date.now(),t:t.t,cat:t.cat,proj:t.proj,date:n,time:t.time,dur:t.dur,rem:t.rem,rep:[]})}else t.date=n;save();render()}
function tdlg(id){const t=D.tasks.find(x=>x.id===id)||{rep:[],date:pd,rem:10,dur:30};
 $('#dlg').innerHTML=`<h3>${id?'تعديل':'إضافة'} نشاط</h3><label>العنوان</label><input id="f1" value="${esc(t.t||'')}"><label>التصنيف</label><select id="f2">${opts(D.cats,t.cat)}</select><label>المشروع</label><select id="f3">${opts(D.projects,t.proj,'— بدون —')}</select>
 <div class="r"><div style="flex:1"><label>التاريخ/البداية</label><input id="f4" type="date" value="${t.date}"></div><div style="flex:1"><label>الوقت</label><input id="f5" type="time" value="${t.time||''}"></div></div>
 <div class="r"><div style="flex:1"><label>المدة (دقيقة)</label><input id="f6" type="number" value="${t.dur||''}"></div><div style="flex:1"><label>تذكير قبل (دقيقة، فارغ=بدون)</label><input id="f7" type="number" value="${t.rem==null?'':t.rem}"></div></div>
 <label>التكرار (فارغ = مرة واحدة)</label><div class="days">${DN.map((n,i)=>`<label><input type="checkbox" class="rp" value="${i}" ${t.rep.includes(i)?'checked':''}>${n.slice(0,3)}</label>`).join('')}</div>
 <div class="r" style="margin-top:12px"><button class="p" onclick="tsave(${id||0})">حفظ</button><button onclick="$('#dlg').close()">إلغاء</button></div>`;$('#dlg').showModal()}
function tsave(id){const v=i=>$('#f'+i).value;if(!v(1).trim())return;
 const o={t:v(1).trim(),cat:v(2),proj:v(3),date:v(4)||today(),time:v(5),dur:+v(6)||0,rem:v(7)===''?null:+v(7),rep:[...document.querySelectorAll('.rp:checked')].map(x=>+x.value)};
 if(id)Object.assign(D.tasks.find(t=>t.id===id),o);else D.tasks.push(Object.assign({id:Date.now(),done:{}},o));
 save();$('#dlg').close();render()}

/* ---- views ---- */
const V={};
V.home=()=>{const d=today(),L=tasksOn(d),dn=L.filter(t=>t.done&&t.done[d]).length,pc=L.length?Math.round(dn/L.length*100):0;
 const sec=D.sessions.filter(s=>s.date===d).reduce((a,s)=>a+s.sec,0),now=new Date().toTimeString().slice(0,5),up=L.filter(t=>t.time>=now&&!(t.done&&t.done[d])),od=overdue();
 return `<h2>مرحبًا 👋 ${DN[dow(d)]} ${d}</h2>
 <div class="c"><div class="r sp"><h3>إنجاز اليوم</h3><span>${dn}/${L.length}</span></div><div class="r"><div class="bar"><i style="width:${pc}%"></i></div><b>${pc}%</b></div><div class="mu" style="margin-top:6px">الوقت المسجل اليوم: ${fm(sec)}</div></div>
 ${D.active?`<div class="c r sp"><div>⏱️ مؤقت نشط: <b>${esc(D.active.cat)}</b></div><button class="p" onclick="go('timer')">فتح</button></div>`:''}
 ${streakCard()}${habCard()}${revNudge()}${todoCard()}<div class="c"><h3>مهام اليوم</h3>${L.map(t=>trow(t,d)).join('')||'<div class="mu">لا مهام اليوم</div>'}<button onclick="tdlg(0)" style="margin-top:8px">＋ إضافة نشاط</button></div>
 <div class="c"><h3>القادم</h3>${up.slice(0,3).map(t=>`<div class="row"><div class="t">${esc(t.t)}</div><span class="mu">${t.time}</span></div>`).join('')||'<div class="mu">لا شيء قادم</div>'}</div>
 ${od.length?`<div class="c"><h3 class="wa">متأخرة (${od.length})</h3>${od.slice(0,6).map(x=>`<div class="row"><div class="t">${esc(x[0].t)}<div class="mu">${x[1]}</div></div><button class="g" onclick="mv(${x[0].id},'${x[1]}')">نقل ⏭</button></div>`).join('')}</div>`:''}`};
V.plan=()=>{let body='';
 if(pv==='day'){body=tasksOn(pd).map(t=>trow(t,pd)).join('')||'<div class="mu">لا أنشطة في هذا اليوم</div>'}
 else if(pv==='week'){for(let i=0;i<7;i++){const d=add(pd,i);body+=`<div class="mu" style="margin-top:8px"><b>${DN[dow(d)]} ${d}</b></div>`+(tasksOn(d).map(t=>trow(t,d)).join('')||'<div class="mu">—</div>')}}
 else{const f=pd.slice(0,8)+'01',s=dow(f),n=new Date(+f.slice(0,4),+f.slice(5,7),0).getDate();body='<div class="cal">'+DN.map(x=>`<b>${x.slice(0,3)}</b>`).join('')+'<span></span>'.repeat(s)+Array.from({length:n},(_,i)=>{const d=f.slice(0,8)+String(i+1).padStart(2,'0'),c=tasksOn(d).length;return `<div onclick="pd='${d}';pv='day';render()">${i+1}<br><small>${c||''}</small></div>`}).join('')+'</div>'}
 return `<h2>الجدول</h2><div class="r sp"><div class="r">${[['day','يوم'],['week','أسبوع'],['month','شهر']].map(x=>`<button class="${pv===x[0]?'p':''}" onclick="pv='${x[0]}';render()">${x[1]}</button>`).join('')}</div><input type="date" value="${pd}" onchange="pd=this.value;render()"></div>
 <div class="c" style="margin-top:10px">${body}</div><button class="p" onclick="tdlg(0)">＋ نشاط جديد</button>`};

/* timer */
const A=()=>D.active,el=()=>{const a=A();return a.acc+(a.seg?Date.now()-a.seg:0)};
function tmode(m){tm=m;render()}
function tstart(id){const t=D.tasks.find(x=>x.id===id);tab='timer';if(!D.active){D.active={mode:tm,acc:0,seg:null,cat:t.cat,proj:t.proj||'',task:id,phase:'focus',t0:Date.now(),target:0};}tm=D.active.mode;startT(true);}
function startT(skip){if(!D.active){const g=i=>$('#'+i).value;const m=tm;let tg=0;if(m==='cd')tg=(+g('cdm')||25)*60000;if(m==='pomo')tg=D.cfg.pomo*60000;
 D.active={mode:m,acc:0,seg:null,cat:g('tcat'),proj:g('tproj'),task:+g('ttask')||0,phase:'focus',t0:Date.now(),target:tg}}
 if(!D.active.seg)D.active.seg=Date.now();save();render()}
function pauseT(){const a=A();a.acc=el();a.seg=null;save();render()}
function saveSess(sec,a){if(sec<5)return;D.sessions.push({id:Date.now(),cat:a.cat,proj:a.proj,task:a.task,sec:Math.round(sec),date:ds(new Date(a.t0)),start:a.t0})}
function endT(){const a=A();if(a.phase==='focus')saveSess(el()/1000,a);D.active=null;save();
 if(a.task&&a.phase==='focus'&&confirm('هل أنجزت المهمة؟')){const t=D.tasks.find(x=>x.id===a.task);if(t){t.done=t.done||{};t.done[today()]=1}save()}render()}
function tick(){const a=D.active,e=document.getElementById('disp');if(!a)return;const x=el();
 if(e)e.textContent=a.mode==='sw'?hms(x):hms(a.target-x);
 if(a.seg&&a.mode!=='sw'&&x>=a.target){if(a.mode==='cd'){saveSess(a.target/1000,a);D.active=null;save();notify('انتهى المؤقت ✅');render()}
  else{if(a.phase==='focus'){saveSess(a.target/1000,a);a.phase='break';a.target=D.cfg.brk*60000;a.t0=Date.now();notify('وقت الاستراحة ☕')}else{a.phase='focus';a.target=D.cfg.pomo*60000;a.t0=Date.now();notify('عودة للتركيز 🎯')}a.acc=0;a.seg=Date.now();save();render()}}}
function msess(){const m=+prompt('عدد الدقائق:','30');if(!m)return;const d=prompt('التاريخ:',today());D.sessions.push({id:Date.now(),cat:$('#tcat')?$('#tcat').value:D.cats[0],proj:'',task:0,sec:m*60,date:d,start:Date.now()});save();render()}
function esess(id,k){const s=D.sessions.find(x=>x.id===id);if(k){D.sessions=D.sessions.filter(x=>x.id!==id)}else{const m=+prompt('الدقائق:',Math.round(s.sec/60));if(m)s.sec=m*60}save();render()}
V.timer=()=>{const a=A(),d=today();const ss=D.sessions.filter(s=>s.date===d).slice().reverse();
 const ctl=a?`<div class="mu" style="text-align:center">${esc(a.cat)} ${a.proj?'· '+esc(a.proj):''} ${a.mode==='pomo'?'· '+(a.phase==='focus'?'تركيز':'استراحة'):''}</div>
 <div class="r" style="justify-content:center">${a.seg?'<button onclick="pauseT()">⏸ إيقاف مؤقت</button>':'<button class="p" onclick="startT()">▶ استئناف</button>'}<button onclick="endT()">⏹ إنهاء</button></div>`:
 `<div class="r" style="justify-content:center">${[['sw','ساعة إيقاف'],['cd','تنازلي'],['pomo','بومودورو']].map(x=>`<button class="${tm===x[0]?'p':''}" onclick="tmode('${x[0]}')">${x[1]}</button>`).join('')}</div>
 ${tm==='cd'?'<label class="mu">الدقائق</label> <input id="cdm" type="number" value="25" style="width:80px">':''}
 <div class="big">${tm==='sw'?'00:00:00':hms((tm==='cd'?25:D.cfg.pomo)*60000)}</div>
 <label class="mu">التصنيف</label><select id="tcat" style="width:100%">${opts(D.cats)}</select><label class="mu">المشروع</label><select id="tproj" style="width:100%">${opts(D.projects,'','— بدون —')}</select>
 <label class="mu">المهمة</label><select id="ttask" style="width:100%"><option value="">— بدون —</option>${tasksOn(d).map(t=>`<option value="${t.id}">${esc(t.t)}</option>`).join('')}</select>
 <div class="r" style="justify-content:center;margin-top:12px"><button class="p" onclick="startT()">▶ ابدأ</button></div>`;
 return `<h2>المؤقت</h2><div class="c">${a?`<div class="big" id="disp">${a.mode==='sw'?hms(el()):hms(a.target-el())}</div>`:''}${ctl}</div>
 <div class="c"><div class="r sp"><h3>جلسات اليوم</h3><button onclick="msess()">＋ يدوي</button></div>${ss.map(s=>`<div class="row"><div class="t">${esc(s.cat)} <span class="mu">${s.proj?esc(s.proj):''}</span></div><b>${fm(s.sec)}</b><button class="g" onclick="esess(${s.id})">✎</button><button class="g" onclick="esess(${s.id},1)">🗑</button></div>`).join('')||'<div class="mu">لا جلسات بعد</div>'}</div>`};

/* habits */
const hk=(d,id)=>d+'|'+id;
function hmark(id,d){const h=D.habits.find(x=>x.id===id),k=hk(d,id);if(h.ty==='check'){D.hlog[k]?delete D.hlog[k]:D.hlog[k]=1}else{const m=+prompt('أضف دقائق:','10');if(!m)return;D.hlog[k]=(D.hlog[k]||0)+m}save();render()}
function streak(h){let n=0,d=today();if(!D.hlog[hk(d,h.id)])d=add(d,-1);while(D.hlog[hk(d,h.id)]){n++;d=add(d,-1)}return n}
function hadd(){const n=prompt('اسم العادة:');if(!n)return;const ty=confirm('موافق = عادة بنقرة واحدة، إلغاء = عادة بهدف زمني')?'check':'time';const tg=ty==='time'?+prompt('الهدف بالدقائق يوميًا:','20'):0;const mt=+prompt('هدف شهري بعدد المرات (0 = بدون):','0')||0;D.habits.push({id:Date.now(),n,ty,tg,mt});save();render()}
function hdel(id){if(confirm('حذف العادة؟')){D.habits=D.habits.filter(h=>h.id!==id);save();render()}}
V.habits=()=>{const d=today(),mo=d.slice(0,7);return `<h2>العادات</h2><div class="c">${D.habits.map(h=>{const v=D.hlog[hk(d,h.id)]||0;const mc=Object.keys(D.hlog).filter(k=>k.startsWith(mo)&&k.endsWith('|'+h.id)).length;

V.books=()=>{const d=today(),w=add(d,-6),sm=f=>D.rlog.filter(f).reduce((a,x)=>a+x.p,0);let st=0,x=d;if(!D.rlog.some(r=>r.d===x))x=add(x,-1);while(D.rlog.some(r=>r.d===x)){st++;x=add(x,-1)}
 const bc=b=>{const pc=b.pg?Math.round(b.read/b.pg*100):0;return `<div class="c"><div class="r sp"><div><b>${esc(b.n)}</b><div class="mu">${esc(b.au)} · بدأ ${b.start}</div></div><span style="color:#e0a100">${b.rate?'★'.repeat(b.rate)+'☆'.repeat(5-b.rate):''}</span></div><div class="r" style="margin:8px 0"><div class="bar"><i style="width:${pc}%"></i></div><span class="mu">${b.read}${b.pg?'/'+b.pg:''} ص</span></div>${b.sum?`<details><summary class="mu">ملخصي</summary><p style="white-space:pre-wrap">${esc(b.sum)}</p></details>`:''}<div class="r"><button class="p" onclick="bpages(${b.id})">＋ صفحات</button><button onclick="btimer()">⏱</button><button onclick="bdlg(${b.id})">✎ ملخص/تقييم</button><button onclick="bfin(${b.id})">${b.fin?'↩ إعادة':'✔ أنهيته'}</button><button class="g" onclick="bdel(${b.id})">🗑</button></div></div>`};

 <button class="p" onclick="bdlg(0)" style="margin-bottom:12px">＋ كتاب جديد</button>${cur.length?'<h3>أقرأه الآن</h3>'+cur.map(bc).join(''):''}${fin.length?'<h3>أنهيتها</h3>'+fin.map(bc).join(''):''}${D.books.length?'':'<div class="mu">أضف أول كتاب وسجّل صفحاتك كل يوم</div>'}`};

/* review & ideas */
function wstats(w){const all=Array.from({length:7},(_,i)=>add(w,i)),dys=all.filter(d=>d<=today()),S=D.sessions.filter(s=>all.includes(s.date));let tot=0,dn=0;dys.forEach(d=>tasksOn(d).forEach(t=>{tot++;if(t.done&&t.done[d])dn++}));
 return{sec:S.reduce((a,s)=>a+s.sec,0),tot,dn,pg:D.rlog.filter(r=>all.includes(r.d)).reduce((a,r)=>a+r.p,0),hb:Object.keys(D.hlog).filter(k=>all.includes(k.split('|')[0])).length,jb:D.jobs.log.filter(x=>all.includes(x.d)).length,gl:D.todo.filter(x=>all.includes(x.d)).length}}

 if(i<0)v(3).split('\n').map(x=>x.trim()).filter(Boolean).forEach(t=>D.todo.push({id:Date.now()+Math.random(),t,k:'week',d:0}));
 if(i>=0)D.revs[i]=o;else D.revs.push(o);save();toast('تم حفظ مراجعة الأسبوع ✅');render()}

V.rev=()=>{const w=wk(today()),s=wstats(w),c=D.revs.find(r=>r.w===w),o=c||{win:'',imp:'',nxt:'',rate:3};
 const st=[['الوقت المسجل',fm(s.sec)],['المهام المنجزة',s.dn+'/'+s.tot],['تسجيلات العادات',s.hb],['صفحات مقروءة',s.pg],['تقديمات وظائف',s.jb],['أهداف أُنجزت',s.gl]];
 return `<h2>مراجعة الأسبوع</h2><div class="mu">من ${w}</div><div class="c"><div class="grid" style="grid-template-columns:repeat(3,1fr);text-align:center">${st.map(x=>`<div><div class="mu">${x[0]}</div><b>${x[1]}</b></div>`).join('')}</div></div>
 <div class="c"><label class="mu">ما الذي أنجزته وأفخر به؟</label><textarea id="r1" rows="3" style="width:100%">${esc(o.win)}</textarea><label class="mu">ما الذي أحسّنه الأسبوع القادم؟</label><textarea id="r2" rows="3" style="width:100%">${esc(o.imp)}</textarea><label class="mu">${c?'أهداف الأسبوع القادم (أُضيفت للمهام سابقًا)':'أهداف الأسبوع القادم (سطر لكل هدف، وتُضاف إلى المهام)'}</label><textarea id="r3" rows="3" style="width:100%">${esc(o.nxt)}</textarea><label class="mu">تقييم أسبوعي</label><select id="r4">${[1,2,3,4,5].map(n=>`<option value="${n}" ${n===o.rate?'selected':''}>${'★'.repeat(n)}</option>`).join('')}</select><div style="margin-top:10px"><button class="p" onclick="rsave()">حفظ المراجعة</button></div></div>

 let tot=0,dn=0;days.forEach(d=>tasksOn(d).forEach(t=>{tot++;if(t.done&&t.done[d])dn++;pl[t.cat]=(pl[t.cat]||0)+(t.dur||0)*60}));
 const cats=[...new Set([...Object.keys(by),...Object.keys(pl)])].sort((a,b)=>(by[b]||0)-(by[a]||0)),mx=Math.max(1,...cats.map(c=>Math.max(by[c]||0,pl[c]||0)));
 const all=S.reduce((a,s)=>a+s.sec,0),last=Array.from({length:7},(_,i)=>add(today(),i-6)),dd=last.map(d=>D.sessions.filter(s=>s.date===d).reduce((a,s)=>a+s.sec,0)),dm=Math.max(1,...dd);
 return `<h2>التقارير</h2><div class="r">${[['day','اليوم'],['week','أسبوع'],['month','شهر']].map(x=>`<button class="${rg===x[0]?'p':''}" onclick="rg='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
 <div class="c" style="margin-top:10px"><div class="grid" style="grid-template-columns:repeat(2,1fr)"><div><div class="mu">إجمالي الوقت</div><b>${fm(all)}</b></div><div><div class="mu">جلسات التركيز</div><b>${S.length}</b></div><div><div class="mu">متوسط الجلسة</div><b>${S.length?fm(all/S.length):'—'}</b></div><div><div class="mu">الالتزام بالجدول</div><b>${tot?Math.round(dn/tot*100):0}%</b></div></div></div>
 <div class="c"><h3>الوقت حسب المجال (فعلي ▇ / مخطط ▒)</h3>${cats.map(c=>`<div style="margin:8px 0"><div class="r sp"><span>${esc(c)}</span><span class="mu">${fm(by[c]||0)} / ${fm(pl[c]||0)}</span></div><div class="bar" style="height:8px"><i style="width:${(by[c]||0)/mx*100}%"></i></div><div class="bar" style="height:6px;margin-top:3px;opacity:.5"><i style="width:${(pl[c]||0)/mx*100}%"></i></div></div>`).join('')||'<div class="mu">لا بيانات بعد</div>'}</div>
 <div class="c"><h3>آخر 7 أيام</h3><div class="r" style="align-items:flex-end;justify-content:space-around;height:120px">${dd.map((v,i)=>`<div style="text-align:center;font-size:11px"><div style="width:26px;background:var(--ac);border-radius:6px;height:${v/dm*80}px;margin:auto"></div>${fm(v)}<br>${DN[dow(last[i])].slice(0,3)}</div>`).join('')}</div></div>`};

/* settings */
function cadd(){const n=prompt('اسم التصنيف:');if(n){D.cats.push(n);save();render()}}
function cdel(i){if(confirm('حذف التصنيف؟')){D.cats.splice(i,1);save();render()}}
function cfg(k,v){D.cfg[k]=Math.max(1,+v||1);save()}
function perm(){if(!window.Notification){toast('المتصفح لا يدعم الإشعارات');return}Notification.requestPermission().then(r=>toast(r==='granted'?'تم تفعيل الإشعارات':'لم يُمنح الإذن'))}
function theme(t){document.documentElement.setAttribute('data-theme',t)}
function exp(){const csv='date,category,project,minutes\n'+D.sessions.map(s=>[s.date,s.cat,s.proj,Math.round(s.sec/60)].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n');
 $('#dlg').innerHTML=`<h3>تصدير / استيراد</h3><label>نسخة كاملة (انسخها واحفظها، أو الصق نسخة سابقة ثم اضغط استيراد)</label><textarea id="ex" rows="7">${esc(JSON.stringify(D))}</textarea><label>سجل الوقت CSV</label><textarea rows="5" readonly>${esc(csv)}</textarea><div class="r" style="margin-top:10px"><button class="p" onclick="imp()">استيراد</button><button onclick="$('#dlg').close()">إغلاق</button></div>`;$('#dlg').showModal()}
function imp(){try{const o=JSON.parse($('#ex').value);if(!o.tasks||!o.cats)throw 0;D=o;save();$('#dlg').close();render();toast('تم الاستيراد')}catch(e){toast('نص غير صالح')}}
V.set=()=>`<h2>الإعدادات</h2><div class="c"><h3>التصنيفات</h3><div class="r">${D.cats.map((c,i)=>`<span class="chip">${esc(c)} <a onclick="cdel(${i})" style="cursor:pointer">✕</a></span>`).join('')}</div><button onclick="cadd()" style="margin-top:8px">＋ تصنيف</button></div>
 <div class="c"><h3>بومودورو</h3><div class="r"><label>تركيز</label><input type="number" value="${D.cfg.pomo}" style="width:70px" onchange="cfg('pomo',this.value)"><label>استراحة</label><input type="number" value="${D.cfg.brk}" style="width:70px" onchange="cfg('brk',this.value)"></div></div>
 <div class="c"><h3>التذكيرات</h3><button onclick="perm()">🔔 تفعيل إشعارات الهاتف</button><p class="mu">التذكيرات تعمل فقط والصفحة مفتوحة (ولو في الخلفية). عند إغلاق الموقع تمامًا لا يستطيع المتصفح إرسال إشعارات من صفحة ويب عادية، وستجد المهام المتأخرة في الرئيسية عند فتحه.</p></div>
 <div class="c"><h3>المظهر والبيانات</h3><div class="r"><button onclick="theme('light')">فاتح</button><button onclick="theme('dark')">داكن</button><button onclick="exp()">📤 تصدير / استيراد</button></div><p class="mu">البيانات محفوظة في متصفح هذا الجهاز.</p></div>`;

/* reminders */
setInterval(()=>{tick();const d=today(),now=new Date(),m=now.getHours()*60+now.getMinutes();
 tasksOn(d).forEach(t=>{if(!t.time||t.rem==null||(t.done&&t.done[d]))return;const[h,mi]=t.time.split(':').map(Number),k=t.id+d,sn=(D.fired[k+'s']||0);
  if(!D.fired[k]&&m>=h*60+mi-t.rem&&m<h*60+mi+60&&m>=sn){D.fired[k]=1;save();notify('⏰ '+t.t+' — '+t.time)}})},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();
</script></body></html>
